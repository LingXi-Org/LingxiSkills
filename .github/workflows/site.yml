name: Build and deploy LingxiSkills site

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'web/**'
      - '.github/workflows/site.yml'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'web/**'
      - '.github/workflows/site.yml'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validator
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate all Skills
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' skill_file; do
            found=1
            python -m skills_ref.cli validate "$(dirname "$skill_file")"
          done < <(find skills -mindepth 2 -maxdepth 2 -type f -iname 'skill.md' -print0 | sort -z)
          test "$found" -eq 1
  build:
    needs: validate-skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix web
      - name: Build static export
        run: npm run build --prefix web
      - name: Upload static output
        uses: actions/upload-artifact@v4
        with:
          name: lingxiskills-site
          path: web/out
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate-skills, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix web
      - name: Build export for Pages
        run: npm run build --prefix web
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.123.0 pages deploy web/out --project-name=lingxiskills
